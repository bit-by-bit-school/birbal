services:
  api:
    build: .
    command: uv run fastapi dev birbal/main.py --host 0.0.0.0 --port ${PORT}
    ports:
      - "${PORT}:${PORT}"
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"    
      APP_PORT: ${PORT}
      EMBED_HOST: "http://host.docker.internal:11434"
      LLM_HOST: "http://host.docker.internal:11434"
      OLLAMA_HOST: "http://host.docker.internal:11434"
      POSTGRES_HOST: "db"
      POSTGRES_PORT: 5432
      MIGRATIONS_DIR: "/app/birbal/migrations"      
    volumes:
      - .:/app
      - /app/.venv
      - ${FILE_DIR}:${FILE_DIR}:ro
    depends_on:
      - db

  db:
    image: pgvector/pgvector:pg16
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
